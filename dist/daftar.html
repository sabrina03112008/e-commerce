<!DOCTYPE html>
<html lang="id">
<head>

  <link href="output.css" rel="stylesheet">

<body class="bg-[#FFB8E0] font-sans">
  <div class="min-h-screen flex items-center justify-center px-4 py-8">

<div class="absolute top-4 left-4">
  <a href="landingpage.html" class="block rounded p-2 hover:bg-white hover:shadow transition">

      <!-- Kiri - Logo & Welcome -->

      </div>
      

      <!-- Kanan - Form -->

        <div>
    <button class="w-full px-4 py-3 rounded-xl bg-pink-200 text-gray-700 font-semibold py-3 px-4 rounded-lg flex items-center justify-center space-x-2">

    </button>
</div>
        <!-- Garis pemisah -->

          <hr class="flex-grow border-gray-300">
        </div>
     <form class="space-y-5">
  <input

  >
<button
  type="button"
  onclick="window.location.href='Homepage.html'"
  class="w-full bg-[#EC7FA9] hover:bg-pink-500 text-white font-bold py-3 px-4 rounded-lg transition-colors duration-200">
  Masuk
</button>




        <!-- Daftar akun -->
        <p class="text-xs text-center mt-6 text-[#EC7FA9]">Saya setuju dengan aturan penggunaan dan kebijakan privasi BunnyShop saat mendaftar.
